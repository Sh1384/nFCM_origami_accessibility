[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nfcm-origami-accessibility"
version = "1.0.0"
description = "Nano-flow cytometry analysis of probe accessibility on coated DNA origami"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "fcsparser>=0.2.4",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "umap-learn>=0.5.4",
    "torch>=2.0",
    "statsmodels>=0.14",
    "pyarrow>=14.0",
    "seaborn>=0.13",
]

[tool.setuptools]
packages = ["nfcm"]
